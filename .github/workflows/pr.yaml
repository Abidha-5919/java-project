name: pull_request
on: 
    pull_request:
        branches: 
            - dev
jobs: 
    build:
        runs-on: ubuntu-latest
        steps:
            - name: get the code
              uses: actions/checkout@v6
            - name: compile the code
              run: mvn compile
            - name: test the package
              run: mvn test
            - name: build the package
              run: mvn clean package               
  